<!-- Navbar principal -->
<nav class="w-full min-h-20 flex items-center justify-between p-4 bg-[#648f80] flex-wrap">

    <!-- LOGO -->
    <div 
      class="text-2xl sm:text-3xl font-extrabold cursor-pointer text-white tracking-tight flex-none"
      routerLink="/home"
    >
      <span class="font-black text-transparent bg-gradient-to-b from-white to-blue-300 bg-clip-text">
        AgendaAi
      </span>
    </div>



  <!-- DIREITA: menu desktop + mobile + speeddial -->
  <div class="flex flex-col sm:flex-row items-center sm:space-x-6 mt-3 sm:mt-0">

    <!-- 🔹 MENU DESKTOP -->
    <ul 
      class="menu-desktop hidden sm:flex 
             space-x-6 font-semibold text-white 
             text-base md:text-lg"
    >
      <li class="cursor-pointer py-1 rounded transition" routerLink="/contact">
        Fale conosco
      </li>

      <li class="cursor-pointer px-2 py-1 rounded transition" routerLink="/about">
        Sobre
      </li>

      @if(!logged) {
        <li
          class="cursor-pointer hover:bg-[rgba(153,197,182,1)] px-2 py-1 rounded transition-colors duration-200"
          routerLink="/login"
        >
          Login
        </li>
      } @else {
        <ng-container>
          <p-speeddial 
            class="w-10 h-10"  
            [model]="items"
            direction="down"
            [transitionDelay]="80"
          >
            <ng-template #button let-toggleCallback="toggleCallback">
              <p-button 
                outlined 
                styleClass="border text-base"  
                (click)="toggleCallback($event)" 
              >
                {{ primary_letter }}
              </p-button>
            </ng-template>
          </p-speeddial>
        </ng-container>
      }
    </ul>

    <!-- 🔹 HAMBÚRGUER (aparece só no mobile) -->
    <div class="hamburger sm:hidden" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- 🔹 MENU MOBILE -->
<ul class="menu-mobile sm:hidden" [ngClass]="{ 'show': menuOpen }">
  
      <li class="cursor-pointer py-2 rounded transition" routerLink="/contact" (click)="toggleMenu()">
        Fale conosco
      </li>

      <li class="cursor-pointer py-2 rounded transition" routerLink="/about" (click)="toggleMenu()">
        Sobre
      </li>

      @if(!logged) {
        <li
          class="cursor-pointer hover:bg-[rgba(153,197,182,1)] py-2 rounded transition-colors duration-200"
          routerLink="/login"
          (click)="toggleMenu()"
        >
          Login
        </li>
      } @else {
        <ng-container>
          <p-speeddial 
            class="w-10 h-10 mx-auto mt-2"  
            [model]="items"
            direction="down"
            [transitionDelay]="80"
          >
            <ng-template #button let-toggleCallback="toggleCallback">
              <p-button 
                outlined 
                styleClass="border text-base"  
                (click)="toggleCallback($event)" 
              >
                {{ primary_letter }}
              </p-button>
            </ng-template>
          </p-speeddial>
        </ng-container>
      }
    </ul>

  </div>

</nav>
