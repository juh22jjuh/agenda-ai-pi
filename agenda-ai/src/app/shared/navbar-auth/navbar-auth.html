<!-- Navbar principal, ocupa 100% da largura, altura mínima de 5rem (~20), usa flexbox para alinhar itens, padding interno e cor de fundo -->
<nav class="w-full min-h-20 flex items-center justify-between p-4 bg-[#648f80] flex-wrap">

  <!-- Lado esquerdo da navbar: seta de voltar + logo -->
  <div class="flex items-center space-x-3 sm:space-x-4">

    <!-- SETA DE NAVEGAÇÃO que leva para /home -->
    <div 
      class="cursor-pointer text-white hover:opacity-80 transition"
      routerLink="/home"
    >
      <!-- Ícone SVG da seta -->
      <svg xmlns="http://www.w3.org/2000/svg" 
           class="w-6 h-6 sm:w-7 sm:h-7 md:w-8 md:h-8" 
           fill="none" 
           viewBox="0 0 24 24" 
           stroke="currentColor" 
           stroke-width="2">
        <!-- Caminho da seta: curva arredondada -->
        <path stroke-linecap="round" stroke-linejoin="round" 
              d="M15 19l-7-7 7-7" />
      </svg>
    </div>

    <!-- LOGO DA APLICAÇÃO, clicável e leva para /home -->
    <div 
      class="text-2xl sm:text-3xl font-extrabold cursor-pointer text-white tracking-tight"
      routerLink="/home"
    >
      <!-- Nome da marca com gradiente aplicado -->
      <span class="font-black text-transparent bg-gradient-to-b from-white to-blue-300 bg-clip-text">
        AgendaAi
      </span>
    </div>

  </div>

  <!-- Lado direito: links de navegação + speed dial -->
  <div class="flex flex-col sm:flex-row items-center sm:space-x-6 mt-3 sm:mt-0 w-full sm:w-auto">

    <!-- LINKS: menu responsivo, muda de coluna (mobile) para linha (desktop) -->
    <ul 
      class="flex flex-col sm:flex-row 
             space-y-2 sm:space-y-0 sm:space-x-6 
             font-semibold text-white 
             text-sm sm:text-base md:text-lg
             w-full sm:w-auto text-center"
    >
      <!-- Link para página de contato -->
      <li class="cursor-pointer py-1 rounded transition" routerLink="/contact">
        Fale conosco
      </li>

      <!-- Link para página Sobre -->
      <li class="cursor-pointer px-2 py-1 rounded transition" routerLink="/about">
        Sobre
      </li>

      <!-- Se usuário NÃO estiver logado, mostrar link de Login -->
      @if(!logged) {
        <li
          class="cursor-pointer hover:bg-[rgba(153,197,182,1)] px-2 py-1 rounded transition-colors duration-200"
          routerLink="/login"
        >
          Login
        </li>
      }
    </ul>

    <!-- SPEEDDIAL (menu flutuante) aparece se usuário ESTIVER logado -->
    @if(logged) {
      <ng-container>
        <p-speeddial 
          class="w-8 h-8 sm:w-9 sm:h-9 md:w-10 md:h-10 mt-2 sm:mt-0"  
          [model]="items"            
          direction="down"          
          [transitionDelay]="80"     
        >
          <!-- Template do botão principal do SpeedDial -->
          <ng-template #button let-toggleCallback="toggleCallback">
            <p-button 
              outlined 
              styleClass="border text-xs sm:text-sm md:text-base"  
              (click)="toggleCallback($event)" 
            >
              {{ primary_letter }} <!-- Letra inicial do usuário -->
            </p-button>
          </ng-template>
        </p-speeddial>
      </ng-container>
    }

  </div>
</nav>
