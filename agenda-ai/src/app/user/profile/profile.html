<app-navbar-auth></app-navbar-auth>

<main class="main-profile flex flex-col items-center min-h-[91vh] px-3 py-8">

  <div class="container-profile">

    <!-- 🌿 MENU LATERAL -->
    <div class="menu-lateral">

      <h3>{{ user?.name }}</h3>
      <p>{{ user?.email }}</p>

      <p-divider></p-divider>

      <ul>
        <li (click)="selectTab('minhaConta')"
            [class.active]="activeTab === 'minhaConta'">
          <i class="pi pi-user"></i> Minha Conta
        </li>

        <li (click)="selectTab('meusAgendamentos')"
            [class.active]="activeTab === 'meusAgendamentos'">
          <i class="pi pi-calendar"></i> Meus Agendamentos
        </li>
      </ul>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="conteudo-principal">

      <!-- Aba Minha Conta -->
      <div *ngIf="activeTab === 'minhaConta'">
        <p-card header="Minha Conta" class="card-config">

          <!-- Mostrar apenas os dados -->
          <div *ngIf="!showEditForm" class="info-text">
            <p><strong>Nome:</strong> {{ user?.name }}</p>
            <p><strong>Email:</strong> {{ user?.email }}</p>

            <button pButton type="button" label="Alterar Informações Pessoais"
                    (click)="toggleEditForm()">
            </button>
          </div>

          <!-- Formulário de edição -->
          <form *ngIf="showEditForm" class="form-edit">
            <div class="p-field">
              <label>Nome</label>
              <input type="text" pInputText [(ngModel)]="user.name" name="name">
            </div>

            <div class="p-field">
              <label>Email</label>
              <input type="text" pInputText disabled [(ngModel)]="user.email" name="email">
            </div>

            <button pButton type="button" label="Salvar"
                    (click)="salvarInfoPessoal()"></button>

            <button pButton type="button" label="Cancelar"
                    class="p-button-secondary"
                    (click)="toggleEditForm()">
            </button>
          </form>

        </p-card>
      </div>

      <!-- Aba Meus Agendamentos -->
      <div *ngIf="activeTab === 'meusAgendamentos'">
        <app-my-schedules></app-my-schedules>
      </div>

    </div>
  </div>
</main>

<app-footer></app-footer>
