<app-navbar-auth></app-navbar-auth>
<div class="surface-ground">
  <div class="grid grid-nogutter">
    <div class="col-12 md:col-4 lg:col-3">
      <div class="p-3">
        <p-card styleClass="h-full profile-sidebar">
          <div class="flex flex-column align-items-center h-full">
            <p-avatar [image]="profileImageUrl" size="xlarge" shape="circle"></p-avatar>
            <p class="font-bold text-lg mt-3">{{ user.name + ' ' + user.surname }}</p>
            <p class="text-sm text-gray-500">{{ user.email }}</p>
            <p-fileUpload
              mode="basic"
              name="profileImage"
              chooseLabel="Mudar foto"
              [auto]="true"
              (onSelect)="alterarFoto($event)"
              class="mt-auto"
            >
            </p-fileUpload>
          </div>
        </p-card>
      </div>
    </div>
    <div class="col-12 md:col-8 lg:col-9">
      <div class="p-3">
        <p-card>
          <div class="tab-container">
            <div class="tab-buttons">
              <button (click)="selectTab('minhaConta')" [class.active]="activeTab === 'minhaConta'">Minha Conta</button>
              <button (click)="selectTab('seguranca')" [class.active]="activeTab === 'seguranca'">Segurança</button>
              <button (click)="selectTab('meusAgendamentos')" [class.active]="activeTab === 'meusAgendamentos'">Meus Agendamentos</button>
            </div>

            <div *ngIf="activeTab === 'minhaConta'" class="p-fluid tab-content">
              <div class="field">
                <label for="name">Nome</label>
                <input pInputText id="name" type="text" [(ngModel)]="updatedUser.name" />
              </div>
              <div class="field">
                <label for="surname">Sobrenome</label>
                <input pInputText id="surname" type="text" [(ngModel)]="updatedUser.surname" />
              </div>
              <div class="field">
                <label for="email">Email</label>
                <input pInputText id="email" type="text" [(ngModel)]="user.email" [disabled]="true" />
              </div>
              <div class="formgrid grid">
                <div class="field col">
                  <button pButton label="Salvar" (click)="salvarInfoPessoal()"></button>
                </div>
              </div>
            </div>

            <div *ngIf="activeTab === 'seguranca'" class="p-fluid tab-content">
              <div class="field">
                <label for="currentPassword">Senha Atual</label>
                <p-password id="currentPassword" [(ngModel)]="senhaAtual" [toggleMask]="true"></p-password>
              </div>
              <div class="field">
                <label for="newPassword">Nova Senha</label>
                <p-password id="newPassword" [(ngModel)]="novaSenha" [toggleMask]="true"></p-password>
              </div>
              <div class="field">
                <label for="confirmPassword">Confirmar Nova Senha</label>
                <p-password id="confirmPassword" [(ngModel)]="confirmarSenha" [toggleMask]="true"></p-password>
              </div>
              <div class="formgrid grid">
                <div class="field col">
                  <button pButton label="Alterar Senha" (click)="alterarSenha(senhaAtual, novaSenha, confirmarSenha)"></button>
                </div>
              </div>
            </div>

            <div *ngIf="activeTab === 'meusAgendamentos'" class="tab-content">
              <app-my-schedules></app-my-schedules>
            </div>
          </div>
        </p-card>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
