<!-- Navbar do administrador -->
<app-navbar-adm></app-navbar-adm>

<main 
  class="flex flex-col items-center min-h-[91vh] bg-[#C7DED5] px-3 py-8"
  role="main" 
  aria-label="Gerenciamento de Reclamações"
>

  <h1 class="text-2xl font-bold mb-6 text-center">
    Gerenciamento de Reclamações
  </h1>

  <ng-container *ngIf="contato.length > 0; else carregando">

    <section class="w-full max-w-7xl">

      <ul 
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
        role="list"
        aria-label="Lista de reclamações"
      >

        <li 
          *ngFor="let item of contato" 
          role="listitem"
          class="h-full"
        >

          <article
            class="p-5 border border-gray-200 rounded-2xl bg-white shadow-sm hover:shadow-md 
                   transition-all flex flex-col h-auto min-h-[230px]"
            aria-label="Card de reclamação"
          >

            <div class="flex-1 flex flex-col overflow-hidden">

              <header class="mb-2">
                <h2 class="text-lg font-semibold">Reclamação</h2>
              </header>

              <div 
                class="flex flex-col gap-1 overflow-y-auto pr-1 text-sm sm:text-base"
                style="max-height: 160px;"
              >

                <p><strong>Email:</strong> {{ item?.email }}</p>
                <p><strong>Telefone:</strong> {{ item?.telefone }}</p>
                <p><strong>Assunto:</strong> {{ item?.assunto }}</p>
                <p><strong>Mensagem:</strong> {{ item?.mensagem }}</p>

              </div>

            </div>

          </article>

        </li>

      </ul>

    </section>

  </ng-container>

  <ng-template #carregando>
    <section class="py-10" aria-live="polite">
      <p class="text-gray-700 text-lg">Carregando contatos...</p>
    </section>
  </ng-template>

</main>

<app-footer></app-footer>
