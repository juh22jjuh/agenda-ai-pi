<!-- Navbar exclusiva do administrador -->
<app-navbar-adm></app-navbar-adm>
<!--
  Componente Angular que renderiza a barra de navegação específica para usuários administradores.
  Geralmente inclui links e ações administrativas (não altera o DOM aqui, é um componente custom).
-->

<!-- Container principal da página -->
<main class="main-container">
<!--
  Área principal do conteúdo desta rota/página.
  A classe 'main-container' controla o layout (altura mínima, background, padding e centralização).
  Usamos <main> por semântica: indica o conteúdo principal para leitores de tela e SEO.
-->

  <!-- Título da página -->
  <h1 class="page-title">Gerenciamento de Estabelecimentos</h1>
  <!--
    Título principal da página. Ajuda usuários e motores de busca a entender o objetivo da página.
    A classe 'page-title' define tipografia e espaçamento.
  -->

  <!-- Wrapper que contém todo conteúdo da página -->
  <section class="content-wrapper">
  <!--
    Seção que envolve todo o conteúdo funcional (lista de empresas, estados de loading, vazio etc.).
    'section' é semântica para agrupar conteúdo temático; 'content-wrapper' limita largura (max-width).
  -->

    <!-- Exibe o spinner enquanto os dados ainda estão carregando -->
    <ng-container *ngIf="loading; else conteudo">
    <!--
      ng-container é um wrapper não-renderizado no DOM.
      *ngIf="loading; else conteudo" -> se a variável 'loading' for true exibe este bloco,
      caso contrário renderiza o template referenciado por 'conteudo'.
    -->
      <div class="loading-center">
        <!-- Container com estilos para centralizar o spinner -->
        <p-progressSpinner></p-progressSpinner>
        <!--
          Componente visual de carregamento (provavelmente do PrimeNG).
          Usado para indicar que os dados estão sendo buscados/processados.
        -->
      </div>
    </ng-container>

    <!-- Template exibido quando não está carregando -->
    <ng-template #conteudo>
    <!--
      Template nomeado '#conteudo' que contém a lógica principal da listagem.
      É exibido quando 'loading' é false.
    -->

      <!-- Caso existam empresas cadastradas -->
      <ng-container *ngIf="empresas.length > 0; else vazio">
      <!--
        Se houver pelo menos uma empresa em 'empresas', exibe a lista.
        Caso contrário renderiza o template '#vazio'.
      -->

        <!-- Lista responsiva em grid -->
        <ul class="empresa-grid">
        <!--
          Lista não-ordenada que contém os cards das empresas.
          A classe 'empresa-grid' controla o layout em grid responsivo (1/2/3 colunas conforme viewport).
        -->

          <!-- Loop que percorre todas as empresas -->
          <li *ngFor="let empresa of empresas">
          <!--
            *ngFor: diretiva do Angular que repete este <li> para cada item do array 'empresas'.
            'empresa' passa a ser a variável local para cada iteração.
          -->

            <!-- Card individual de cada empresa -->
            <article class="empresa-card">
            <!--
              Elemento semântico <article>: representa conteúdo independente (um card/registro).
              'empresa-card' define aparência, sombras e comportamento ao hover.
            -->

              <!-- Cabeçalho do card com o nome da empresa -->
              <header>
                <h2 class="empresa-title">{{empresa.name}}</h2>
                <!--
                  Nome da empresa exibido dinamicamente com interpolação {{empresa.name}}.
                  h2 é semântico para subtítulo dentro da página.
                -->
              </header>

              <!-- Informações principais do endereço -->
              <p><strong>Cidade:</strong> {{empresa.cidade}} - {{empresa.estado}}</p>
              <!-- Exibe cidade e estado vindo do objeto 'empresa' -->
              <p><strong>Bairro:</strong> {{empresa.bairro}}</p>
              <!-- Exibe bairro -->
              <p><strong>Endereço:</strong> {{empresa.rua}}, {{empresa.numero}}</p>
              <!-- Exibe rua e número -->
              <p><strong>Telefone:</strong> {{empresa.telefone}}</p>
              <!-- Exibe telefone de contato -->

              <!-- Área onde ficam botões (ativar/desativar) -->
              <footer class="footer-actions">
              <!--
                Footer do card que agrupa ações possíveis sobre a empresa.
                'footer-actions' usa flexbox para posicionar botões e inputs.
              -->

                <!-- Se a empresa estiver ativa -->
                <div *ngIf="empresa.isActive">
                <!--
                  Condição: mostra o bloco de suspensão/desativação somente se 'empresa.isActive' for true.
                -->

                  <!-- Caixa contendo input + botão vermelho -->
                  <div class="deactivate-box">
                  <!--
                    Container horizontal que alinha o input (dias de suspensão) e o botão Desativar.
                  -->

                    <!-- Input onde o ADM define dias de suspensão -->
                    <input 
                      type="number" 
                      [(ngModel)]="deactivationDays[empresa._id]"
                      placeholder="Dias de suspensão"
                      class="input-number">
                    <!--
                      Campo numérico:
                      - type="number": restringe para valores numéricos.
                      - [(ngModel)]="deactivationDays[empresa._id]": two-way binding do Angular Forms,
                        vincula o valor do input ao objeto 'deactivationDays' usando o _id da empresa como chave.
                        Isso permite armazenar dias de suspensão por empresa no componente.
                      - placeholder: texto orientativo exibido quando o campo está vazio.
                      - class 'input-number' controla estilos (borda, padding, largura).
                    -->

                    <!-- Botão que chama a função de desativar -->
                    <button
                      class="button-red"
                      (click)="deactivateEntrepreneur(empresa._id)">
                      Desativar
                    </button>
                    <!--
                      Botão estilizado em vermelho:
                      - (click)="deactivateEntrepreneur(empresa._id)": handler do Angular que chama a função
                        'deactivateEntrepreneur' no componente, passando o id da empresa.
                      - Usado para colocar a empresa em estado inativo/suspenso pelo número de dias definido.
                    -->
                  </div>
                </div>

                <!-- Se a empresa estiver desativada aparece o botão verde -->
                <button 
                  class="button-green"
                  *ngIf="!empresa.isActive"
                  (click)="activateEntrepreneur(empresa._id)">
                  Ativar
                </button>
                <!--
                  Botão visível apenas quando a empresa NÃO está ativa:
                  - *ngIf="!empresa.isActive": renderiza este botão se empresa.isActive for false.
                  - (click)="activateEntrepreneur(empresa._id)": chama a função para reativar a empresa.
                  - 'button-green' ocupa largura full no card (definido pelo CSS) deixando ação destacada.
                -->

              </footer>

            </article>
          </li>
        </ul>

      </ng-container>

    </ng-template>

    <!-- Caso não exista nenhuma empresa -->
    <ng-template #vazio>
      <section class="empty-section">
        <p class="empty-text">Nenhum estabelecimento encontrado.</p>
        <!--
          Bloco exibido quando 'empresas.length' é 0.
          'empty-section' centraliza o conteúdo, 'empty-text' estiliza a mensagem.
        -->
      </section>
    </ng-template>

  </section>

</main>

<!-- Rodapé padrão do sistema -->
<app-footer></app-footer>
<!--
  Componente custom que renderiza o rodapé da aplicação.
  Mantém consistência visual entre páginas (links, copyright, info de contato).
-->
