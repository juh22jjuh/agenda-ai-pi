<div class="scheduling-container">
  <h1 class="title">Formulário de Agendamento</h1>

  <form [formGroup]="schedulingForm" (ngSubmit)="submit()" class="form">
    
    <div class="form-group">
      <label for="customer_name">Nome Completo</label>
      <input id="customer_name" type="text" pInputText formControlName="customer_name" />
    </div>

    <div class="form-group">
      <label for="customer_age">Idade</label>
      <input id="customer_age" type="number" pInputText formControlName="customer_age" />
    </div>

    <div class="form-group">
      <label for="description">Descrição (Opcional)</label>
      <textarea id="description" pInputTextarea formControlName="description"></textarea>
    </div>

    <!-- DatePicker PrimeNG -->
    <div class="form-group">
      <label>Selecione a Data</label>
      <p-datepicker 
        formControlName="date"
        [inline]="true"
        [disabledDates]="disabledDates"
        [minDate]="minDate"
        (onMonthChange)="onMonthChange($event)"
        dateFormat="yy-mm-dd"
        styleClass="custom-datepicker"
      ></p-datepicker>
    </div>

    <div class="form-group" *ngIf="schedulingForm.get('date')?.value">
      <label>Horários Disponíveis</label>
      <div *ngIf="availableTimes.length > 0; else noTimes">
        <select formControlName="time" class="form-control">
          <option *ngFor="let time of availableTimes" [value]="time">{{ time }}</option>
        </select>
      </div>
      <ng-template #noTimes>
        <p class="no-times">Nenhum horário disponível para esta data.</p>
      </ng-template>
    </div>

    <button 
      type="submit" 
      class="btn-submit" 
      [disabled]="!schedulingForm.valid">
      Agendar
    </button>

  </form>
</div>

<app-footer></app-footer>
