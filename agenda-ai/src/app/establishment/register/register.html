<app-navbar-auth></app-navbar-auth>
<p-toast></p-toast>

<div class="register-container">
  <p-card styleClass="form-card">
    <ng-template pTemplate="header">
      Cadastro de Estabelecimento
    </ng-template>

    <form [formGroup]="entrepreneurRegisterForm" (ngSubmit)="registerEntrepreneur()">

      <h3 class="section-title">Dados do Estabelecimento</h3>
      <div class="form-grid">
        <div class="field">
          <label for="name">Nome do Estabelecimento *</label>
          <input pInputText id="name" formControlName="name" />
        </div>
        <div class="field">
          <label for="cpf">CPF *</label>
          <p-inputMask id="cpf" mask="999.999.999-99" formControlName="cpf"></p-inputMask>
        </div>
      </div>

      <h3 class="section-title">Contato</h3>
      <div class="form-grid">
        <div class="field">
          <label for="telefone">Telefone *</label>
          <p-inputMask id="telefone" mask="(99) 99999-9999" formControlName="telefone"></p-inputMask>
        </div>
        <div class="field">
          <label for="company-image">Imagem da empresa</label>
          <p-fileUpload name="companyImage" 
                        (onSelect)="onFileSelect($event)" 
                        [showUploadButton]="false" 
                        [showCancelButton]="false"
                        accept="image/*" 
                        chooseLabel="Escolher imagem">
          </p-fileUpload>
        </div>
      </div>

      <h3 class="section-title">Endereço</h3>
      <div class="form-grid">
        <div class="field">
          <label for="cep">CEP *</label>
          <p-inputMask id="cep" mask="99999-999" formControlName="cep" (onBlur)="buscarEndereco()"></p-inputMask>
        </div>
        <div class="field">
          <label for="rua">Rua *</label>
          <input pInputText id="rua" formControlName="rua" />
        </div>
        <div class="field">
          <label for="numero">Número *</label>
          <input pInputText id="numero" formControlName="numero" />
        </div>
        <div class="field">
          <label for="comple">Complemento</label>
          <input pInputText id="comple" formControlName="comple" />
        </div>
        <div class="field">
          <label for="bairro">Bairro *</label>
          <input pInputText id="bairro" formControlName="bairro" />
        </div>
        <div class="field">
          <label for="cidade">Cidade *</label>
          <input pInputText id="cidade" formControlName="cidade" />
        </div>
        <div class="field">
           <label for="estado">Estado *</label>
           <select id="estado" formControlName="estado">
            <option value="" disabled>Selecione o Estado</option>
            <option *ngFor="let s of states" [value]="s.value">{{ s.name }}</option>
          </select>
        </div>
      </div>

      <div class="terms-container">
        <p-checkbox formControlName="termos" [binary]="true"></p-checkbox>
        <span class="terms-text">
          Concordo com os
          <a routerLink="/establishment/termos">Termos de Uso</a> e
          <a routerLink="/establishment/politicas">Política de Privacidade</a> *
        </span>
      </div>

      <div class="button-container">
        <button pButton type="button" label="Limpar" severity="secondary" (click)="clearForm()"></button>
        <button pButton type="submit" label="Cadastrar" severity="primary" [disabled]="!entrepreneurRegisterForm.valid"></button>
      </div>

    </form>
  </p-card>
</div>

<app-footer></app-footer>
