
<!-- PrimeNG Notifications -->
<p-toast />
<p-confirmDialog [style]="{width: '50vw'}" />

<app-navbar-esta />

<div class="profile-container">
  <!-- Loading and Error States -->
  <p-progressSpinner *ngIf="loading" />
  <div *ngIf="!loading && errorMessage && !entrepreneur" class="error-message">
    {{ errorMessage }}
  </div>

  <!-- Main Content -->
  <div *ngIf="!loading && entrepreneur" class="profile-content">
    
    <!-- Profile Card -->
    <p-card styleClass="profile-card">
      <ng-template pTemplate="header">
        <img [src]="'http://localhost:3000/' + entrepreneur.image" alt="Imagem da empresa" class="profile-image">
      </ng-template>
      <ng-template pTemplate="title">{{ entrepreneur.name }}</ng-template>
      <ng-template pTemplate="content">
        <div class="profile-details">
          <p><strong>Endereço:</strong> {{ entrepreneur.rua }}, {{ entrepreneur.numero }} - {{ entrepreneur.bairro }}, {{ entrepreneur.cidade }} - {{ entrepreneur.estado }}</p>
          <p><strong>CEP:</strong> {{ entrepreneur.cep }}</p>
          <p><strong>Telefone:</strong> {{ entrepreneur.telefone }}</p>
        </div>
      </ng-template>
      <ng-template pTemplate="footer">
        <div class="profile-actions">
          <p-button label="Editar Perfil" icon="pi pi-pencil" (click)="openEditProfileDialog()" />
          <p-button label="Excluir Empresa" icon="pi pi-trash" styleClass="p-button-danger" (click)="deleteCompany()" />
        </div>
      </ng-template>
    </p-card>

    <!-- Services Section (existing code) -->
    <div class="section-card">
        <!-- ... service table ... -->
    </div>

    <!-- Schedules Section (existing code) -->
    <div class="section-card">
        <!-- ... schedule table ... -->
    </div>

  </div>
</div>

<!-- Edit Profile Dialog -->
<p-dialog header="Editar Perfil" [(visible)]="displayEditProfileDialog" [modal]="true" [style]="{width: '50vw'}" (onHide)="hideEditProfileDialog()">
  <form [formGroup]="editProfileForm" (ngSubmit)="saveProfile()">
    <div class="p-fluid">
      <div class="p-field">
        <label for="name">Nome da Empresa</label>
        <input id="name" type="text" pInputText formControlName="name">
      </div>
      <div class="p-field">
        <label for="telefone">Telefone</label>
        <input id="telefone" type="text" pInputText formControlName="telefone">
      </div>
      <div class="p-field">
        <label for="cep">CEP</label>
        <input id="cep" type="text" pInputText formControlName="cep">
      </div>
      <div class="p-field">
        <label for="rua">Rua</label>
        <input id="rua" type="text" pInputText formControlName="rua">
      </div>
      <div class="p-grid">
          <div class="p-col-8">
              <div class="p-field">
                <label for="bairro">Bairro</label>
                <input id="bairro" type="text" pInputText formControlName="bairro">
              </div>
          </div>
          <div class="p-col-4">
              <div class="p-field">
                <label for="numero">Número</label>
                <input id="numero" type="text" pInputText formControlName="numero">
              </div>
          </div>
      </div>
      <div class="p-field">
        <label for="comple">Complemento</label>
        <input id="comple" type="text" pInputText formControlName="comple">
      </div>
      <div class="p-grid">
          <div class="p-col-8">
              <div class="p-field">
                  <label for="cidade">Cidade</label>
                  <input id="cidade" type="text" pInputText formControlName="cidade">
              </div>
          </div>
          <div class="p-col-4">
              <div class="p-field">
                  <label for="estado">Estado</label>
                  <input id="estado" type="text" pInputText formControlName="estado">
              </div>
          </div>
      </div>
      <div class="p-field">
        <label for="image">Imagem de Perfil</label>
        <p-fileUpload name="image" (onSelect)="onProfileImageSelect($event)" [showUploadButton]="false" accept="image/*" chooseLabel="Escolher Imagem"></p-fileUpload>
      </div>
    </div>
    <div class="p-dialog-footer">
      <p-button label="Cancelar" icon="pi pi-times" styleClass="p-button-text" (click)="hideEditProfileDialog()" />
      <p-button label="Salvar" icon="pi pi-check" type="submit" />
    </div>
  </form>
</p-dialog>


<!-- Service Creation/Editing Dialog (existing code) -->

    <!-- ... service form ... -->
</p-dialog>

<app-footer />
