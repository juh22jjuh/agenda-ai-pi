
<app-navbar-esta></app-navbar-esta>

<div class="profile-container">
  <!-- 1. Indicador de Carregamento -->
  <div *ngIf="loading" class="loading-spinner">
    <p-progressSpinner styleClass="w-8rem h-8rem" strokeWidth="6"></p-progressSpinner>
    <p>Carregando perfil...</p>
  </div>

  <!-- 2. Mensagem de Erro -->
  <div *ngIf="errorMessage && !loading" class="error-message">
    <p-card header="Ocorreu um Erro">
      <p>{{ errorMessage }}</p>
      <button pButton label="Tentar Novamente" (click)="ngOnInit()"></button>
    </p-card>
  </div>

  <!-- 3. Conteúdo do Perfil (Apenas quando carregado e sem erros) -->
  <div *ngIf="!loading && entrepreneur && !errorMessage" class="profile-content">
    <p-card>
      <ng-template pTemplate="header">
        <div class="profile-header">
          <!-- Usa a imagem da empresa, ou uma imagem padrão se não existir -->
          <img [src]="entrepreneur?.image || 'https://via.placeholder.com/150'" alt="Imagem da Empresa" class="company-image">
        </div>
      </ng-template>
      <ng-template pTemplate="title">
        <!-- Acessa o nome de forma segura -->
        <h2 class="company-name">{{ entrepreneur?.name }}</h2>
      </ng-template>
      <ng-template pTemplate="content">
        <div class="profile-details">
          <div class="detail-item">
            <i class="pi pi-phone"></i>
            <span>{{ entrepreneur?.telefone }}</span>
          </div>
          <div class="detail-item">
            <i class="pi pi-id-card"></i>
            <span>CPF: {{ entrepreneur?.cpf }}</span>
          </div>
          <div class="detail-item-full">
            <i class="pi pi-map-marker"></i>
            <span>{{ entrepreneur?.rua }}, {{ entrepreneur?.numero }} - {{ entrepreneur?.bairro }}, {{ entrepreneur?.cidade }} - {{ entrepreneur?.estado }}</span>
          </div>
          <div class="detail-item-full">
            <span>CEP: {{ entrepreneur?.cep }}</span>
          </div>
        </div>
      </ng-template>
      <ng-template pTemplate="footer">
        <div class="profile-actions">
          <button pButton label="Gerenciar Serviços" icon="pi pi-cog" (click)="navigateTo('/establishment/services')"></button>
          <button pButton label="Ver Agendamentos" icon="pi pi-calendar" class="p-button-secondary" (click)="navigateTo('/establishment/scheduling')"></button>
        </div>
      </ng-template>
    </p-card>
  </div>
</div>

<app-footer></app-footer>
