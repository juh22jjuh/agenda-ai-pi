<!-- Componente PrimeNG para mensagens (toast notifications) -->
<p-toast></p-toast>

<!-- Navbar da área autenticada -->
<app-navbar-auth></app-navbar-auth>

<!-- Container principal centralizado verticalmente -->
<div class="flex flex-col justify-center items-center min-h-[91.7vh] bg-slate-50 px-4">

  <!-- Card branco centralizado com sombra e borda arredondada -->
  <div class="w-full max-w-md bg-white shadow-xl rounded-xl p-6 flex flex-col items-center gap-6">

    <!-- Título do formulário -->
    <h1 class="text-2xl text-[#648f80] font-semibold text-center">
      Digite sua nova senha
    </h1>

    <!-- Formulário para redefinir senha -->
    <!-- (submit)="resetPassword(); $event.preventDefault()": chama função no TS e previne reload -->
    <form class="w-full flex flex-col gap-4" (submit)="resetPassword(); $event.preventDefault()">

      <!-- Campo Nova Senha -->
      <div class="flex flex-col gap-1 w-full">
        <input 
          pInputText                  
          type="password"            
          [(ngModel)]="newPassword"  
          name="newPassword"           
          placeholder="Nova Senha"     
          class="input-field"         
          required                   
        />
      </div>

      <!-- Campo Confirmar Senha -->
      <div class="flex flex-col gap-1 w-full">
        <input 
          pInputText
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Digite a Senha novamente"
          class="input-field"
          required
        />
      </div>

      <!-- Link para página de login -->
      <div class="flex flex-col items-center gap-2 text-center w-full">
        <a routerLink="/login" class="link-footer">Login</a>
      </div>

      <!-- Botão de envio do formulário -->
      <button pButton type="submit" class="footer-button">
        Confirmar Nova Senha
      </button>

      <!-- Mensagem de sucesso ou erro -->
      <!-- [ngClass] aplica cor verde ou vermelha dependendo do conteúdo de 'mensagem' -->
      <p class="text-center mt-2 font-medium"
         [ngClass]="{ 'text-green-600': mensagem.includes('sucesso'), 
                      'text-red-600': mensagem.includes('Erro') || mensagem.includes('não') }">
        {{ mensagem }}
      </p>

    </form>
  </div>
</div>

<!-- Rodapé da página -->
<app-footer></app-footer>
