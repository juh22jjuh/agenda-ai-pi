<!-- Componente do PrimeNG responsável por exibir toasts (alertas visuais) -->
<p-toast></p-toast>

<!-- Navbar específica da área autenticada do app -->
<app-navbar-auth></app-navbar-auth>

<!-- Container principal da página -->
<div class="flex flex-col justify-center items-center min-h-[91.7vh] bg-[#C7DED5] px-4">
  
  <!-- Container central com imagem + formulário -->
  <div class="flex flex-col md:flex-row w-full max-w-4xl bg-white shadow-2xl rounded-xl overflow-hidden">
    
    <!-- Lado esquerdo: imagem de fundo -->
    <div class="flex md:w-1/2 min-h-[420px] items-center justify-center bg-gray-50"
         style="background-image: url('assets/imagem3.jpg'); 
                background-size: cover; 
                background-position: center;">
    </div>

    <!-- Lado direito: formulário -->
    <div class="w-full md:w-1/2 flex flex-col justify-center items-center p-6 md:p-12">
      
      <!-- Container interno do conteúdo -->
      <div class="w-full max-w-sm flex flex-col items-center gap-6">
        
        <!-- Título principal -->
        <h1 class="text-2xl md:text-3xl font-semibold text-center border-b-2 border-gray-200 pb-3 w-full"
            style="color: rgb(110, 153, 139);">
          Esqueceu sua senha?
        </h1>

        <!-- Subtítulo explicativo -->
        <p class="text-center text-gray-600 text-sm">
          Enviaremos um link de redefinição para o seu e-mail.
        </p>

        <!-- FORMULÁRIO DE ENVIO -->
        <!-- (submit)="enviarEmail()": chama função no TypeScript -->
        <!-- $event.preventDefault(): evita que a página recarregue -->
        <form class="w-full flex flex-col gap-4" (submit)="enviarEmail(); $event.preventDefault()">

          <!-- Campo de email -->
          <div class="flex flex-col gap-1 w-full">
            
            <!-- Rótulo do input -->
            <label for="email" class="text-sm font-medium text-gray-700">
              Email
            </label>

            <!-- Input ligado ao ngModel para two-way data binding -->
            <input 
              id="email"                    
              type="email"                
              [(ngModel)]="email"           
              name="email"                  
              placeholder="email@exemplo.com" 
              class="input-field"           
              required                      
            />
          </div>

          <!-- Link para voltar ao login -->
          <div class="flex flex-col items-center gap-2 text-center w-full">
            <a routerLink="/login" class="link-footer text-sm">
              Voltar para login
            </a>
          </div>

          <!-- Botão de envio do formulário -->
          <button pButton type="submit" class="footer-button mt-2">
            Enviar código
          </button>

          <!-- Mensagem de sucesso ou erro -->
          <!-- ngClass aplica cor verde ou vermelha dependendo do texto -->
          <p class="text-center mt-2 font-medium" 
             [ngClass]="{ 
               'text-green-600': mensagem.includes('sucesso'), 
               'text-red-600': mensagem.includes('não') || mensagem.includes('Erro') 
             }">
            {{ mensagem }}  <!-- Texto exibido dinamicamente -->
          </p>

        </form>

      </div>
    </div>
  </div>
</div>

<!-- Rodapé da página -->
<app-footer></app-footer>
